# Test on every push/PR. On master: build, publish public GHCR image, pull on
# VPS, swap this service only (compose --no-deps), prune old images.
# Frontend pushes never recreate studio-backend.
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (same as the other karanparmar apps)

name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: studio-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVICE: studio-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "1"
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        run: python -m pytest -q tests

      - name: Migration files compile
        run: python -m compileall -q migrations

  build-and-deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Worker image metadata
        id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      # Same code, plus Docling/GLiNER2/CPU torch and their models (document ingestion).
      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: worker
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Make GHCR packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in "${IMAGE_NAME#*/}" "${IMAGE_NAME#*/}-worker"; do
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${pkg}/visibility" \
              -f visibility=public \
              || echo "If this fails, set the package public once in GitHub: Packages → $pkg → Package settings → Change visibility → Public"
          done

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ env.SERVICE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,IMAGE_TAG,SERVICE
          command_timeout: 30m
          script: |
            set -euo pipefail
            # One deploy at a time on this server: parallel pulls and image
            # cleanup from different repos race inside containerd.
            exec 9>/tmp/karanparmar-deploy.lock
            echo "Waiting for other deploys on this server..."
            flock -w 1200 9
            # Private registry login for this job only. A shared ~/.docker/config.json
            # gets overwritten by parallel jobs whose tokens expire mid-pull ("denied").
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd /srv/docker/apps/studio
            export STUDIO_BACKEND_IMAGE="$IMAGE"
            export STUDIO_BACKEND_TAG="$IMAGE_TAG"

            docker compose pull "$SERVICE"


            if ! docker compose up -d --no-deps --pull never --wait --wait-timeout 180 --force-recreate "$SERVICE"; then
              echo "---- $SERVICE logs ----"
              docker compose logs --tail=120 "$SERVICE" || true
              docker inspect --format='{{json .State.Health}}' "$SERVICE" || true
              exit 1
            fi

            # The worker runs the same commit. It has no port or healthcheck; it just restarts.
            export STUDIO_WORKER_IMAGE="${IMAGE}-worker"
            docker compose pull studio-worker
            docker compose up -d --no-deps --pull never --force-recreate studio-worker
            NEW_WORKER_ID="$(docker inspect -f '{{.Image}}' studio-worker)"
            docker images --no-trunc --format '{{.ID}} {{.Repository}}:{{.Tag}}' "${IMAGE}-worker" \
              | while read -r id ref; do
                  [ "$id" = "$NEW_WORKER_ID" ] && continue
                  case "$ref" in
                    *:"<none>") docker rmi "$id" || true ;;
                    *) docker rmi "$ref" || true ;;
                  esac
                done

            NEW_IMAGE_ID="$(docker inspect -f '{{.Image}}' "$SERVICE")"
            # Remove every other local version of this app's image (any tag), then
            # dangling layers and build cache. Scoped to this image so a parallel
            # deploy of another app never loses the image it just pulled.
            docker images --no-trunc --format '{{.ID}} {{.Repository}}:{{.Tag}}' "$IMAGE" \
              | while read -r id ref; do
                  [ "$id" = "$NEW_IMAGE_ID" ] && continue
                  case "$ref" in
                    *:"<none>") docker rmi "$id" || true ;;
                    *) docker rmi "$ref" || true ;;
                  esac
                done
            docker image prune -f
            docker builder prune -af > /dev/null || true

      - name: Delete untagged GHCR versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: studio-projects-backend
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true

      - name: Keep last 3 tagged GHCR versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: studio-projects-backend
          package-type: container
          min-versions-to-keep: 3

      - name: Delete untagged worker GHCR versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: studio-projects-backend-worker
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true

      - name: Keep last 3 tagged worker GHCR versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: studio-projects-backend-worker
          package-type: container
          min-versions-to-keep: 3
